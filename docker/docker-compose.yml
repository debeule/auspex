name: auspex

services:
  kafka:
    image: apache/kafka:4.3.0
    container_name: auspex-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # The image's own default ID, pinned: a formatted volume refuses to start under another.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      # 90 days, the longest topic retention in topics.yaml; the broker default (7 days) would
      # drop core-hub's committed offsets during a longer shutdown.
      KAFKA_OFFSETS_RETENTION_MINUTES: "129600"
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS}
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    mem_limit: ${KAFKA_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  kafka-init:
    image: apache/kafka:4.3.0
    container_name: auspex-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka-init/create-topics.sh:/create-topics.sh:ro
      - ./topics.yaml:/config/topics.yaml:ro
    entrypoint: ["/create-topics.sh"]
    restart: "no"
    mem_limit: ${KAFKA_INIT_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  postgres:
    image: postgres:18.6
    container_name: auspex-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: ${POSTGRES_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  neo4j:
    image: neo4j:2026.05-community
    container_name: auspex-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7474/ > /dev/null 2>&1 || wget -q -O /dev/null http://localhost:7474/ > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    mem_limit: ${NEO4J_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: auspex-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      # Unauthenticated metrics; the port is reachable only from the compose network and localhost.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${MINIO_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  minio-init:
    build: &backtesting-build
      context: ../services/backtesting
      dockerfile: Dockerfile
      args:
        UV_VERSION: ${UV_VERSION}
    image: auspex-backtesting
    container_name: auspex-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment: &minio-env
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    command: ["uv", "run", "--no-project", "python", "-m", "auspex_backtesting.stack_bootstrap", "buckets"]
    restart: "no"
    mem_limit: ${MINIO_INIT_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  price-bootstrap:
    build: *backtesting-build
    image: auspex-backtesting
    container_name: auspex-price-bootstrap
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment: &price-env
      <<: *minio-env
      WATCHED_TICKERS: ${WATCHED_TICKERS}
      PRICE_HISTORY_START: ${PRICE_HISTORY_START}
    command: ["uv", "run", "--no-project", "python", "-m", "auspex_backtesting.stack_bootstrap", "prices"]
    restart: "no"
    mem_limit: ${PRICE_BOOTSTRAP_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  price-service:
    build: *backtesting-build
    image: auspex-backtesting
    container_name: auspex-price-service
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *price-env
      SEC_USER_AGENT: ${SEC_USER_AGENT}
      SEC_SUBMISSIONS_BULK_URL: ${SEC_SUBMISSIONS_BULK_URL}
      SEC_COMPANYFACTS_BULK_URL: ${SEC_COMPANYFACTS_BULK_URL}
      SEC_ARCHIVES_URL: ${SEC_ARCHIVES_URL}
      BACKFILL_SCOPE_START: ${BACKFILL_SCOPE_START}
      UNIVERSE_RULES_PATH: /app/universe/rules.yaml
    volumes:
      - ../config/universe:/app/universe:ro
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      co.elastic.logs/enabled: "true"
    mem_limit: ${PRICE_SERVICE_MEM_LIMIT}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: auspex-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    mem_limit: ${ELASTICSEARCH_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION}
    container_name: auspex-filebeat
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Registry of read positions; without it a recreated filebeat re-ships every log line.
      - filebeat_data:/usr/share/filebeat/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: filebeat -e --strict.perms=false
    restart: unless-stopped
    mem_limit: ${FILEBEAT_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  elasticsearch-setup:
    image: curlimages/curl:8.15.0
    container_name: auspex-elasticsearch-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./elasticsearch:/setup:ro
    command: /setup/setup.sh
    restart: "no"
    mem_limit: ${ELASTICSEARCH_SETUP_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: auspex-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE}
    extra_hosts:
      # The Mac's node_exporter (job mac-host); Docker Desktop provides the name, Linux needs this.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${PROMETHEUS_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION}
    container_name: auspex-grafana
    depends_on:
      elasticsearch:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST}
      GF_SMTP_USER: ${SMTP_USER}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      # Read by alerting/contactpoints.yaml.
      ALERT_CONTACT_TYPE: ${ALERT_CONTACT_TYPE}
      ALERT_EMAIL_ADDRESSES: ${ALERT_EMAIL_ADDRESSES}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
      # Read by alerting/infrastructure.yaml.
      ALERT_DOCKER_DISK_FREE_MIN_PCT: ${ALERT_DOCKER_DISK_FREE_MIN_PCT}
      ALERT_MAC_DISK_FREE_MIN_PCT: ${ALERT_MAC_DISK_FREE_MIN_PCT}
      ALERT_VM_MEMORY_MAX_PCT: ${ALERT_VM_MEMORY_MAX_PCT}
      ALERT_CONTAINER_RESTARTS_MAX_PER_HOUR: ${ALERT_CONTAINER_RESTARTS_MAX_PER_HOUR}
      ALERT_PRICE_REFRESH_MAX_MISSED_SESSIONS: ${ALERT_PRICE_REFRESH_MAX_MISSED_SESSIONS}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: ${GRAFANA_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  ingestion-scraper:
    build:
      context: ../services/ingestion-scraper
      dockerfile: Dockerfile
      args:
        UV_VERSION: ${UV_VERSION}
    container_name: auspex-ingestion-scraper
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      KAFKA_RAW_TOPIC: auspex.raw.ingested
      KAFKA_SIGNALS_TOPIC: auspex.signals.extracted
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL}
      EXTRACTION_BASE_URL: ${EXTRACTION_BASE_URL}
      EXTRACTION_API_KEY: ${EXTRACTION_API_KEY}
      EXTRACTION_PROMPT_VERSION: ${EXTRACTION_PROMPT_VERSION}
      EXTRACTION_REGISTRY_PATH: /app/models/registry.yaml
      EXTRACTION_SCORES_DIR: /app/models/scores
      SEC_USER_AGENT: ${SEC_USER_AGENT}
      EPO_OPS_KEY: ${EPO_OPS_KEY}
      EPO_OPS_SECRET: ${EPO_OPS_SECRET}
      LOG_FORMAT: json
    extra_hosts:
      # Resolves on Linux too; Docker Desktop provides it already.
      - "host.docker.internal:host-gateway"
    volumes:
      - ../config/models:/app/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      co.elastic.logs/enabled: "true"
    mem_limit: ${INGESTION_SCRAPER_MEM_LIMIT}

  core-hub:
    build:
      context: ../services/core-hub
      dockerfile: Dockerfile
    container_name: auspex-core-hub
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SPRING_NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      CORE_HUB_WRITE_TOKEN: ${CORE_HUB_WRITE_TOKEN}
      # The JVM's default heap is a quarter of the container limit, too little for this service.
      JAVA_TOOL_OPTIONS: ${CORE_HUB_JAVA_TOOL_OPTIONS}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    labels:
      co.elastic.logs/enabled: "true"
    mem_limit: ${CORE_HUB_MEM_LIMIT}

  dashboard:
    build:
      context: ../services/dashboard
      dockerfile: Dockerfile
    image: auspex-dashboard
    container_name: auspex-dashboard
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      core-hub:
        condition: service_healthy
    environment:
      CORE_HUB_URL: ${CORE_HUB_URL}
      SCRAPER_API_URL: ${SCRAPER_API_URL}
      PRICE_API_URL: ${PRICE_API_URL}
      CORE_HUB_WRITE_TOKEN: ${CORE_HUB_WRITE_TOKEN}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET}
      DASHBOARD_SESSION_IDLE_MINUTES: ${DASHBOARD_SESSION_IDLE_MINUTES}
    # Grafana holds 3000 on the host.
    ports:
      - "127.0.0.1:${DASHBOARD_PORT}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: ${DASHBOARD_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  airflow-db-role:
    image: postgres:18.6
    container_name: auspex-airflow-db-role
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - ./airflow-db-role/apply-role.sh:/apply-role.sh:ro
    entrypoint: ["sh", "/apply-role.sh"]
    restart: "no"
    mem_limit: ${AIRFLOW_DB_ROLE_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  airflow-state-init:
    image: busybox:1.37.0
    container_name: auspex-airflow-state-init
    # A new named volume is created root-owned; Airflow runs as uid 50000, group 0.
    command: ["sh", "-c", "chown 50000:0 /state && chmod 0770 /state"]
    volumes:
      - airflow_state:/state
    restart: "no"
    mem_limit: ${AIRFLOW_STATE_INIT_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  airflow:
    image: apache/airflow:3.3.1
    container_name: auspex-airflow
    labels:
      co.elastic.logs/enabled: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      price-service:
        condition: service_healthy
      airflow-db-role:
        condition: service_completed_successfully
      airflow-state-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # Set here rather than generated into airflow.cfg inside the container, where a recreate
      # would replace them: the Fernet key decrypts stored Variables such as the ingestion cursors.
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env (SETUP.md)}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env (SETUP.md)}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env (SETUP.md)}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/state/simple_auth_manager_passwords.json
      AUSPEX_SOURCES_YAML: /opt/airflow/config/sources.yaml
      SCRAPER_API_URL: ${SCRAPER_API_URL}
      PRICE_API_URL: ${PRICE_API_URL}
      AIRFLOW__METRICS__STATSD_ON: "true"
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: "9125"
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
    volumes:
      - ../services/ingestion-scraper/dags:/opt/airflow/dags/ingestion:ro
      - ../services/backtesting/dags:/opt/airflow/dags/prices:ro
      - ../services/ingestion-scraper/config:/opt/airflow/config:ro
      - airflow_logs:/opt/airflow/logs
      - airflow_state:/opt/airflow/state
    ports:
      - "127.0.0.1:8082:8080"
    command: standalone
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v2/monitor/health | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: ${AIRFLOW_MEM_LIMIT}

  # Exporters. None publishes a port: Prometheus reaches them on the compose network.

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: auspex-node-exporter
    # Reads the Docker VM (on macOS, Docker Desktop's Linux VM) through PID 1's root, so no host
    # path is bind-mounted; Docker Desktop refuses mounts outside its shared folders.
    pid: host
    user: root
    cap_add:
      - SYS_PTRACE
    command:
      - --path.rootfs=/proc/1/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
      - --collector.textfile.directory=/textfile
    volumes:
      - volume_usage_textfile:/textfile:ro
    restart: unless-stopped
    mem_limit: ${NODE_EXPORTER_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  volume-usage:
    image: busybox:1.37.0
    container_name: auspex-volume-usage
    command: ["sh", "/collect.sh"]
    environment:
      INTERVAL_SECONDS: ${VOLUME_USAGE_INTERVAL_SECONDS}
    volumes:
      - ./volume-usage/collect.sh:/collect.sh:ro
      - volume_usage_textfile:/textfile
      - kafka_data:/volumes/kafka_data:ro
      - postgres_data:/volumes/postgres_data:ro
      - neo4j_data:/volumes/neo4j_data:ro
      - minio_data:/volumes/minio_data:ro
      - airflow_logs:/volumes/airflow_logs:ro
      - airflow_state:/volumes/airflow_state:ro
      - filebeat_data:/volumes/filebeat_data:ro
      - elasticsearch_data:/volumes/elasticsearch_data:ro
      - prometheus_data:/volumes/prometheus_data:ro
      - grafana_data:/volumes/grafana_data:ro
    restart: unless-stopped
    mem_limit: ${VOLUME_USAGE_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  cadvisor:
    image: ghcr.io/google/cadvisor:0.57.0
    container_name: auspex-cadvisor
    # Host cgroups and the Docker socket give per-container CPU, memory and start times.
    privileged: true
    cgroup: host
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped
    mem_limit: ${CADVISOR_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  postgres-monitor-role:
    image: postgres:18.6
    container_name: auspex-postgres-monitor-role
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MONITOR_USER: ${POSTGRES_MONITOR_USER}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD}
    volumes:
      - ./postgres-monitor/create-role.sh:/create-role.sh:ro
    entrypoint: ["sh", "/create-role.sh"]
    restart: "no"
    mem_limit: ${POSTGRES_MONITOR_ROLE_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: auspex-postgres-exporter
    depends_on:
      postgres-monitor-role:
        condition: service_completed_successfully
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_MONITOR_USER}
      DATA_SOURCE_PASS: ${POSTGRES_MONITOR_PASSWORD}
    restart: unless-stopped
    mem_limit: ${POSTGRES_EXPORTER_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    container_name: auspex-kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--kafka.server=kafka:9094"]
    restart: unless-stopped
    mem_limit: ${KAFKA_EXPORTER_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.11.0
    container_name: auspex-elasticsearch-exporter
    depends_on:
      elasticsearch:
        condition: service_healthy
    # Security is off on this single-node cluster, so there is no role to create.
    command: ["--es.uri=http://elasticsearch:9200"]
    restart: unless-stopped
    mem_limit: ${ELASTICSEARCH_EXPORTER_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: auspex-blackbox-exporter
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    extra_hosts:
      # Ollama runs on the host, outside Docker.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./blackbox-exporter/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped
    mem_limit: ${BLACKBOX_EXPORTER_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

  statsd-exporter:
    image: prom/statsd-exporter:v0.31.0
    container_name: auspex-statsd-exporter
    command:
      - --statsd.listen-udp=:9125
      - --statsd.mapping-config=/etc/statsd/mapping.yml
    volumes:
      - ./statsd-exporter/mapping.yml:/etc/statsd/mapping.yml:ro
    restart: unless-stopped
    mem_limit: ${STATSD_EXPORTER_MEM_LIMIT}
    labels:
      co.elastic.logs/enabled: "true"

volumes:
  kafka_data:
  postgres_data:
  neo4j_data:
  minio_data:
  airflow_logs:
  airflow_state:
  filebeat_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  volume_usage_textfile:
