global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: core-hub
    static_configs:
      - targets: ['core-hub:8080']
    metrics_path: /actuator/prometheus

  - job_name: ingestion-scraper
    static_configs:
      - targets: ['ingestion-scraper:8000']
    metrics_path: /metrics

  - job_name: price-service
    static_configs:
      - targets: ['price-service:8001']
    metrics_path: /metrics

  # Docker VM: CPU, memory, the disk holding the volumes, and volume sizes from volume-usage.
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: elasticsearch
    static_configs:
      - targets: ['elasticsearch-exporter:9114']

  - job_name: minio
    static_configs:
      - targets: ['minio:9000']
    metrics_path: /minio/v2/metrics/cluster

  # Airflow's statsd metrics, converted by statsd-exporter.
  - job_name: airflow
    static_configs:
      - targets: ['statsd-exporter:9102']

  # The Mac itself, from a node_exporter installed on the host (SETUP.md). Optional: the stack
  # starts without it, and only the "Mac Host Exporter Down" info alert notices it is missing.
  - job_name: mac-host
    scrape_timeout: 5s
    static_configs:
      - targets: ['host.docker.internal:9100']

  # The prober's own health; each probe's result is in the blackbox-* jobs below.
  - job_name: blackbox
    static_configs:
      - targets: ['blackbox-exporter:9115']

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://core-hub:8080/actuator/health
          - http://ingestion-scraper:8000/health
          - http://price-service:8001/health
          - http://airflow:8080/api/v2/monitor/health
          - http://neo4j:7474/
          - http://minio:9000/minio/health/live
          - http://elasticsearch:9200/_cluster/health
          - http://prometheus:9090/-/healthy
          - http://grafana:3000/api/health
          - http://dashboard:3000/api/health
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - kafka:9094
          - postgres:5432
    relabel_configs: *probe_relabel

  # Ollama on the host. Its own job so "Probe Target Down" can leave it to the extraction-aware rule.
  - job_name: blackbox-ollama
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://host.docker.internal:11434/api/version']
    relabel_configs: *probe_relabel
