apiVersion: 1
groups:
  - name: auspex-operational
    folder: Auspex
    interval: 1m
    rules:
      - uid: auspex-dlt-backlog
        title: DLT Backlog
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 0s
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              expr: sum(increase(auspex_dlt_events_total[1h]))
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions

      - uid: auspex-source-silence
        title: Source Silence
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 5m
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              expr: time() - max by(source_type)(auspex_pipeline_run_last_timestamp) > 21600
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions

      - uid: auspex-kafka-lag-critical
        title: Kafka Lag Critical
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 5m
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(kafka_consumer_fetch_manager_records_lag{topic="auspex.signals.extracted"}) > 1000
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions

      - uid: auspex-scrape-target-down
        title: Scrape Target Down
        condition: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $$labels.job }} ({{ $$labels.instance }}) has been unscrapeable for 5 minutes"
        data:
          # Probe jobs report through probe_success ("Probe Target Down"); the Mac's exporter is
          # optional and has its own info alert.
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: up{job!~"mac-host|blackbox-.+"} == bool 0
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C

      - uid: auspex-llm-extraction-errors
        title: LLM Extraction Errors
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 15m
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: sum(increase(auspex_llm_extraction_calls_total{result="error"}[15m])) / sum(increase(auspex_llm_extraction_calls_total[15m])) > 0.2
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
