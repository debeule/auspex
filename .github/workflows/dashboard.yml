name: Dashboard

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'services/dashboard/**'
      - '.github/workflows/dashboard.yml'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'services/dashboard/**'
      - '.github/workflows/dashboard.yml'

defaults:
  run:
    working-directory: services/dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    # Sentinel values: the bundle test fails if any of them reaches a client chunk.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CORE_HUB_URL: http://core-hub-ci-sentinel:8080
      SCRAPER_API_URL: http://scraper-ci-sentinel:8000
      PRICE_API_URL: http://price-service-ci-sentinel:8001
      CORE_HUB_WRITE_TOKEN: ci-write-token-sentinel
      DASHBOARD_USERNAME: ci-user-sentinel
      DASHBOARD_PASSWORD_HASH: $2b$04$cisentinelhashcisentinelhashcisentinelhashcisentine
      DASHBOARD_SESSION_SECRET: ci-session-secret-sentinel

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: services/dashboard/.nvmrc
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit and component tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: No server secret in the client bundle
        run: npm run test:bundle

      - name: No high or critical advisory in runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  container:
    runs-on: ubuntu-latest
    needs: test
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      # Docker Hub rate-limits anonymous pulls per runner IP; the mirror serves cached official images and falls back to Docker Hub.
      - name: Pull base images through a registry mirror
        working-directory: .
        run: |
          config=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          echo "$config" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.Mirrors}}'

      # Authenticated pulls get a higher Docker Hub limit; skipped until the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret exist, and a Docker Hub outage must not fail the job.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -t auspex-dashboard .

      - name: Start the container and check health, login and the session gate
        run: |
          hash_line=$(printf 'ci-password\n' | docker run --rm -i auspex-dashboard node scripts/hash-password.mjs)
          hash=${hash_line#DASHBOARD_PASSWORD_HASH=\'}
          hash=${hash%\'}
          docker run -d --name dashboard -p 127.0.0.1:3001:3000 \
            -e CORE_HUB_URL=http://127.0.0.1:9 \
            -e SCRAPER_API_URL=http://127.0.0.1:9 \
            -e PRICE_API_URL=http://127.0.0.1:9 \
            -e CORE_HUB_WRITE_TOKEN=ci-token \
            -e DASHBOARD_USERNAME=ci-user \
            -e "DASHBOARD_PASSWORD_HASH=$hash" \
            -e DASHBOARD_SESSION_SECRET=ci-session-secret \
            -e DASHBOARD_SESSION_IDLE_MINUTES=30 \
            auspex-dashboard
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' dashboard)" = healthy ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' dashboard)" = healthy
          test "$(docker exec dashboard id -u)" != 0

          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/watchlist)" = 307
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/core-hub/v1/watchlist)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
            -d '{"username":"ci-user","password":"wrong"}' http://127.0.0.1:3001/api/auth/login)" = 401
          curl -sf -c cookies.txt -H 'content-type: application/json' \
            -d '{"username":"ci-user","password":"ci-password"}' http://127.0.0.1:3001/api/auth/login
          grep -q auspex_session cookies.txt
          # Signed in, the request reaches the BFF, which reports the unreachable upstream.
          test "$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt http://127.0.0.1:3001/api/core-hub/v1/watchlist)" = 502

      - name: Container logs
        if: always()
        run: docker logs dashboard || true
