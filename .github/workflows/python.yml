name: Python

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('services/ingestion-scraper/uv.lock', 'services/backtesting/uv.lock') }}
          restore-keys: uv-

      - name: Install dependencies
        working-directory: services/ingestion-scraper
        run: uv sync --all-extras

      - name: Lint
        working-directory: services/ingestion-scraper
        run: uv run ruff check .

      - name: Type check
        working-directory: services/ingestion-scraper
        run: uv run mypy src

      - name: Run tests
        working-directory: services/ingestion-scraper
        run: uv run pytest -q --ignore=tests/integration/test_infra_containers.py

      - name: Regenerate contract fixture
        working-directory: services/ingestion-scraper
        run: uv run pytest tests/unit/test_contract_fixture.py -q

      - name: Contract fixture drift check
        run: git diff --exit-code services/core-hub/src/test/resources/contract/
