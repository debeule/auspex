name: Python

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Testcontainers prepends this to every test image name, so test images are named as on Docker Hub and pulled from Google's Docker Hub cache.
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
      # Ryuk's own image would get the prefix too, and the runner is discarded after the job anyway.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v7

      # Docker Hub rate-limits anonymous pulls per runner IP; the mirror serves cached official images and falls back to Docker Hub.
      - name: Pull test container images through a registry mirror
        run: |
          config=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          echo "$config" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.Mirrors}}'

      # Authenticated pulls get a higher Docker Hub limit; skipped until the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret exist, and a Docker Hub outage must not fail the job.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('services/ingestion-scraper/uv.lock', 'services/backtesting/uv.lock') }}
          restore-keys: uv-

      - name: Install dependencies
        working-directory: services/ingestion-scraper
        run: uv sync --all-extras

      - name: Lint
        working-directory: services/ingestion-scraper
        run: uv run ruff check .

      - name: Type check
        working-directory: services/ingestion-scraper
        run: uv run mypy src

      # Runs the Grafana alert expressions against synthetic series (test_stack_alert_expressions.py).
      - name: Install promtool
        env:
          PROMETHEUS_VERSION: 3.14.0
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "PROMTOOL=$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" >> "$GITHUB_ENV"

      - name: Run tests
        working-directory: services/ingestion-scraper
        run: uv run pytest -q --ignore=tests/integration/test_infra_containers.py

      - name: Regenerate contract fixture
        working-directory: services/ingestion-scraper
        run: uv run pytest tests/unit/test_contract_fixture.py -q

      - name: Contract fixture drift check
        run: git diff --exit-code services/core-hub/src/test/resources/contract/

  backtesting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: services/backtesting
        run: uv sync --locked

      - name: Run unit tests
        working-directory: services/backtesting
        run: uv run pytest tests/unit -q
