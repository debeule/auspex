name: Java

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      # Docker Hub rate-limits anonymous pulls per runner IP; the mirror serves cached official images and falls back to Docker Hub.
      - name: Pull test container images through a registry mirror
        run: |
          config=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          echo "$config" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.Mirrors}}'

      # Authenticated pulls get a higher Docker Hub limit; skipped until the repository secrets exist.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('services/core-hub/gradle/wrapper/gradle-wrapper.properties', 'services/core-hub/gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Run check + timezone check
        working-directory: services/core-hub
        run: ./gradlew check timezoneCheck --rerun-tasks

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: services/core-hub/build/reports/tests/
