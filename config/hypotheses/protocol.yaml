id: protocol
version: 1
description: "Evaluation protocol locked before any backtest touches the backfill corpus: abnormal-return model, inference, trial accounting, promotion and kill criteria"
abnormal_return:
  model: market_model
  benchmark: XBI
  # Trading days relative to the event's entry date; the gap before day 0 keeps pre-event drift out of alpha and beta.
  estimation_window_trading_days: [-250, -30]
  min_estimation_obs: 120
  # Too little history (recent IPOs): beta 1, alpha 0. The report counts events that used it.
  fallback: market_adjusted
inference:
  standard_errors: two_way_clustered
  cluster_by: [ticker, event_month]
  # Cluster-robust errors understate variance with few clusters; below this, p-values come from the wild cluster bootstrap.
  min_clusters_per_dimension: 30
  below_min_clusters: wild_cluster_bootstrap
  bootstrap_weights: webb
  bootstrap_draws: 9999
  seed: 42
  # Same-ticker events whose holding windows overlap count as one independent event.
  independent_event_rule: same_ticker_overlapping_window_is_one
trials:
  # One trial per (holding_period_days, known_at_delay_days, variant) cell evaluated, summed over every run.
  counting: cells
  # The deflated Sharpe uses the count across all promotable hypotheses evaluated on the same corpus.
  scope: family
  counts_roles: [promotable]
  known_at_delay_days: [0, 1, 3, 5]
  family_budget_cells: 64
promotion:
  judged_on: primary_cell
  clustered_t_min: 3.0
  deflated_sharpe_min: 0.95
  holdout_months: 3
sizing:
  # Ceilings the risk layer validates its .env limits against at startup; .env may set lower values, never higher.
  max_kelly_fraction: 0.25
  max_position_pct: 0.05
  max_positions_per_theme: 1
  hold_through_known_binary_event: only_strategies_that_trade_that_event_type
kill_criteria:
  - id: lagging_signal
    applies_to: [h3]
    evaluated_on: in_sample
    rule: "mean CAR[-20,-1] has the same sign as mean CAR[+1,+20] and |mean CAR[-20,-1]| >= |mean CAR[+1,+20]|, at known_at_delay_days 1"
    action: "stop testing gene-target corroboration as a trading trigger; h1, h2, h4, h6 and h8 are not re-registered on that event definition"
  - id: no_in_sample_effect
    applies_to: promotable
    evaluated_on: in_sample
    min_mean_net_abnormal_return: 0.0
    min_clustered_t: 1.5
    rule: "killed unless at least one registered horizon, at the primary known-at delay and variant, has mean net abnormal return above the minimum in the registered direction and clustered t at or above the minimum"
    action: "drop that event type; it is not re-registered with new horizons on the same corpus"
  - id: mapping_quality
    applies_to: every source used for trading events
    min_event_to_ticker_precision: 0.85
    min_golden_set_events: 50
    max_iterations: 1
    rule: "precision below the minimum after one prompt or rule iteration"
    action: "do not trade on events from that source"
  - id: forward_check
    applies_to: promotable
    evaluated_on: forward_paper_trading
    min_months: 12
    min_independent_events: 60
    min_mean_net_abnormal_return: 0.0
    min_clustered_t: 2.0
    rule: "all minimums must be exceeded before any real capital is committed"
    action: "otherwise Auspex stays a research and risk tool; no live orders"
  - id: cost_check
    applies_to: promotable
    max_cost_to_gross_ratio: 0.5
    rule: "median modelled round-trip cost on the traded names exceeds this fraction of the expected gross abnormal return"
    action: "raise the liquidity floor and re-register, or stop"
status: pre-registered
registered_at: "2026-10-07T00:00:00Z"
