# Local extraction model candidates (Ollama). Not loaded by the service.
#
# scripts/register_local_model.py <tag> copies one entry into registry.yaml and adds the
# `digest` the running Ollama server reports, so the registry pins the exact weights pulled.
#
# num_ctx: Ollama's OpenAI-compatible endpoint ignores per-request num_ctx. The server must be
# started with OLLAMA_CONTEXT_LENGTH >= this value (default 4096), or long prompts are silently
# truncated. See docs/local-model-runbook.md.
#
# cutoff_date drives the usable backfill window (cutoff + 3-month margin). An earlier cutoff
# means less hindsight leakage into directionality/confidence_score (DECISIONS.md 2026-09-19).
candidates:
  mistral-small:24b-instruct-2501-q4_K_M:
    # ~14 GB weights. Recommended primary: strong instruction following and JSON output,
    # Apache 2.0, cutoff before the whole 24-month backfill window.
    backend: local
    cutoff_date: "2023-10-01"
    cutoff_source: "https://huggingface.co/mistralai/Mistral-Small-24B-Instruct-2501"
    num_ctx: 8192
    timeout: 180
    temperature: 0
    seed: 42
    structured_output_mode: "JSON"
  llama3.1:8b-instruct-q8_0:
    # ~8.5 GB weights. Fast fallback; weaker at nuanced is_signal calls.
    backend: local
    cutoff_date: "2023-12-01"
    cutoff_source: "https://github.com/meta-llama/llama-models/blob/main/models/llama3_1/MODEL_CARD.md"
    num_ctx: 8192
    timeout: 90
    temperature: 0
    seed: 42
    structured_output_mode: "JSON"
  gemma3:27b-it-q4_K_M:
    # ~17 GB weights. Likely strongest of the three, but the August 2024 cutoff shortens the
    # clean backfill window to roughly Nov 2024 onwards.
    backend: local
    cutoff_date: "2024-08-01"
    cutoff_source: "https://ai.google.dev/gemma/docs/core/model_card_3"
    num_ctx: 8192
    timeout: 180
    temperature: 0
    seed: 42
    structured_output_mode: "JSON"
