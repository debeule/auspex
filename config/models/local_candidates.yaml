# Local extraction model candidates (Ollama). Not loaded by the service:
# scripts/register_local_model.py <tag> copies an entry into registry.yaml and adds the
# digest reported by the running Ollama server.
#
# num_ctx only holds if the Ollama server runs with OLLAMA_CONTEXT_LENGTH >= num_ctx; its
# OpenAI-compatible endpoint ignores the per-request value and silently truncates.
candidates:
  llama3.1:8b-instruct-q8_0:
    backend: local
    cutoff_date: "2023-12-01"
    cutoff_source: "https://github.com/meta-llama/llama-models/blob/main/models/llama3_1/MODEL_CARD.md"
    num_ctx: 8192
    timeout: 90
    temperature: 0
    seed: 42
    structured_output_mode: "JSON"
  llama3.1:8b-instruct-q4_K_M:
    backend: local
    cutoff_date: "2023-12-01"
    cutoff_source: "https://github.com/meta-llama/llama-models/blob/main/models/llama3_1/MODEL_CARD.md"
    num_ctx: 8192
    timeout: 90
    temperature: 0
    seed: 42
    structured_output_mode: "JSON"
  mistral-small:24b-instruct-2501-q4_K_M:
    backend: local
    cutoff_date: "2023-10-01"
    cutoff_source: "https://huggingface.co/mistralai/Mistral-Small-24B-Instruct-2501"
    num_ctx: 8192
    timeout: 180
    temperature: 0
    seed: 42
    structured_output_mode: "JSON"
  gemma3:27b-it-q4_K_M:
    backend: local
