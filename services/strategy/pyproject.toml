[project]
name = "auspex-strategy"
version = "0.1.0"
description = "Auspex strategy plugin framework, seed strategies and runtime"
requires-python = ">=3.14"
dependencies = [
    "auspex-backtesting",
    "confluent-kafka==2.15.0",
    "minio==7.2.20",
    "pandas==3.0.6",
    "prometheus-client==0.26.0",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
]

[tool.uv.sources]
auspex-backtesting = { path = "../backtesting", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auspex_strategy"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.0",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "types-pyyaml==6.0.12.20250915",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-socket"
markers = [
    "integration: requires live containers via testcontainers",
]

[tool.ruff]
src = ["src"]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["auspex_strategy"]

# Neither ships type information.
[[tool.mypy.overrides]]
module = ["auspex_backtesting.*", "pyarrow.*"]
ignore_missing_imports = true
