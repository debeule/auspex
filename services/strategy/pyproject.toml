[project]
name = "auspex-strategy"
version = "0.1.0"
description = "Auspex strategy plugin framework and seed strategies"
requires-python = ">=3.14"
dependencies = [
    "pyyaml==6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auspex_strategy"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.0",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "pyyaml==6.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-socket"
markers = [
    "integration: requires live containers via testcontainers",
]

[tool.ruff]
src = ["src"]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["auspex_strategy"]
