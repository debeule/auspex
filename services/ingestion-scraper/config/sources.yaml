# schedule: cron in UTC, null for a source that only runs when triggered. Live sources start an
# hour apart and share one Airflow pool slot. rate_limit_rps: per host, requirements §6.5.
# max_documents_per_run: extraction calls per run, sized to fit the DAG's 3 h task timeout.
sources:
  - source_type: mock
    schedule: null
    rate_limit_rps: 10.0
    initial_lookback: 7
    max_documents_per_run: 1000
    prefilter_vocabulary:
      - BCL11A
      - HBB
      - DMD
      - CRISPR
      - gene therapy
      - base editing
    source_config: {}

  - source_type: biorxiv
    schedule: "30 0 * * *"
    rate_limit_rps: 1.0
    initial_lookback: 30
    max_documents_per_run: 150
    prefilter_vocabulary:
      - DMD
      - dystrophin
      - duchenne
      - BCL11A
      - HBB
      - sickle cell
      - thalassemia
      - HTT
      - huntingtin
      - FANCA
      - gene therapy
      - gene editing
      - base editing
      - CRISPR
      - exon skipping
      - micro-dystrophin
      - AAV
    source_config: {}

  - source_type: clinicaltrials
    schedule: "30 2 * * *"
    rate_limit_rps: 1.0
    initial_lookback: 30
    max_documents_per_run: 150
    prefilter_vocabulary:
      - DMD
      - dystrophin
      - duchenne
      - BCL11A
      - HBB
      - sickle cell
      - thalassemia
      - HTT
      - huntingtin
      - FANCA
      - gene therapy
      - gene editing
      - base editing
      - CRISPR
      - exon skipping
      - micro-dystrophin
    source_config: {}

  - source_type: pubmed
    schedule: "30 1 * * *"
    rate_limit_rps: 3.0
    initial_lookback: 30
    max_documents_per_run: 150
    prefilter_vocabulary:
      - DMD
      - dystrophin
      - duchenne
      - BCL11A
      - HBB
      - sickle cell
      - thalassemia
      - HTT
      - huntingtin
      - FANCA
      - gene therapy
      - gene editing
      - base editing
      - CRISPR
      - exon skipping
    source_config:
      search_term: "(gene therapy) OR (CRISPR) OR (base editing) OR (exon skipping) OR (duchenne) OR (BCL11A) OR (sickle cell)"

  - source_type: edgar
    schedule: "30 3 * * *"
    rate_limit_rps: 4.0
    initial_lookback: 30
    max_documents_per_run: 150
    prefilter_vocabulary:
      - gene therapy
      - CRISPR
      - duchenne
      - DMD
      - sickle cell
      - sarepta
      - elevidys
      - beam therapeutics
      - uniqure
      - rocket pharma
      - capricor
    source_config: {}

  - source_type: epo_ops
    schedule: "30 4 * * *"
    rate_limit_rps: 2.0
    initial_lookback: 30
    max_documents_per_run: 150
    prefilter_vocabulary:
      - DMD
      - dystrophin
      - duchenne
      - BCL11A
      - HBB
      - sickle cell
      - thalassemia
      - HTT
      - huntingtin
      - FANCA
      - gene therapy
      - gene editing
      - base editing
      - CRISPR
      - exon skipping
      - AAV
    source_config: {}