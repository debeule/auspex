[project]
name = "auspex-ingest"
version = "0.1.0"
description = "Auspex ingestion scraper"
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.13.4",
    "minio==7.2.20",
    "confluent-kafka==2.15.0",
    "openai==2.54.0",
    "instructor==1.15.4",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "flask==3.1.3",
    "gunicorn==26.2.0",
    "prometheus-client>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auspex_ingest"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-socket==0.8.0",
    "testcontainers[minio,kafka]==4.15.0",
    "respx==0.23.1",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "pyrate-limiter==4.4.0",
    "types-pyyaml>=6.0.12.20260906",
    "psycopg2-binary>=2.9.13",
    "neo4j>=6.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: requires live containers via testcontainers",
]

[tool.ruff]
src = ["src"]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["auspex_ingest"]
