logging:
  level:
    root: INFO

corroboration:
  # Reduced cap so test_high_degree_entity_is_skipped_by_the_degree_cap needs only 5 signals.
  degree-cap: 4
  # Effectively disables the scheduler; tests call runCorroboration() directly.
  interval-ms: 3600000

# Prevent real SEC HTTP call at startup; SecTickerCache logs a warning and leaves cache empty.
auspex:
  sec:
    tickers-url: http://127.0.0.1:1/company_tickers.json
  api:
    write-token: integration-test-write-token
