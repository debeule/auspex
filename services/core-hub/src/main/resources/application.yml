spring:
  application:
    name: core-hub

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:auspex}
    username: ${POSTGRES_USER:auspex_app}
    password: ${POSTGRES_PASSWORD:test_placeholder}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  neo4j:
    uri: bolt://${NEO4J_HOST:localhost}:${NEO4J_PORT:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:test_placeholder}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      max-poll-records: 50
      enable-auto-commit: false
    listener:
      ack-mode: RECORD


logging:
  structured:
    format:
      console: ecs
  level:
    dev.auspex: INFO
    org.springframework.kafka: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      service: core-hub

auspex:
  kafka:
    # Transient listener failures: 1 attempt + 2 retries, waiting initial-ms then initial-ms * multiplier.
    retry:
      initial-ms: ${AUSPEX_KAFKA_RETRY_INITIAL_MS:5000}
      multiplier: ${AUSPEX_KAFKA_RETRY_MULTIPLIER:6.0}
    # How often Postgres and Neo4j are probed; listeners pause while either is unreachable.
    store-check-interval-ms: 5000
  api:
    # Bearer token required on every non-GET request under /api.
    write-token: ${CORE_HUB_WRITE_TOKEN:}
